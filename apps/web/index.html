<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0c10" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Trenchscope — real-time memecoin trading terminal: trenches, trending, smart money, copy trading and sniping, with a built-in market simulator." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Trenchscope</title>
    <script>
      // Apply the saved theme before first paint (store/ui.ts owns the key).
      try {
        var t = localStorage.getItem('ts.theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t;
          if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f4f5f8');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>Trenchscope needs JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
