# Fly.io: the DEMO deployment (simulator + paper trading; no secrets needed).
# From the repository root:
#   fly apps create trenchscope-demo
#   fly volumes create trenchscope_demo_data --app trenchscope-demo --region iad --size 5
#   fly secrets set --app trenchscope-demo METRICS_TOKEN=…
#   fly deploy . --config deploy/fly/demo.toml
#   fly scale count 1 --app trenchscope-demo

app = "trenchscope-demo"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "60s"

[env]
  MODE = "demo"
  TRUST_PROXY = "1"
  DATA_DIR = "/data"

[mounts]
  source = "trenchscope_demo_data"
  destination = "/data"

[deploy]
  strategy = "rolling"

[http_service]
  internal_port = 8787
  force_https = true
  # The simulated market only moves while the process runs: keep it up like the live one.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 1500
    hard_limit = 2000

  [[http_service.checks]]
    grace_period = "120s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
