# Typecheck, unit/integration tests and the web build on every push and pull
# request; the Playwright end-to-end suite and a Docker image build (with a
# smoke test of the container) run as separate jobs.

name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Same Node as the Docker image (Dockerfile NODE_IMAGE).
  NODE_VERSION: 22.22.0

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # pnpm version from package.json "packageManager"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - name: Server tests
        run: pnpm --filter @trenchscope/server test
      - name: Web tests
        run: pnpm --filter @trenchscope/web test
      - name: Web build
        run: pnpm --filter @trenchscope/web build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Slow and browser-dependent: reported, but does not block the pipeline.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # The pinned @playwright/test of apps/web (npx resolves it from there).
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Build web and run Playwright
        run: pnpm e2e
        env:
          E2E_WORKERS: "2"
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: trenchscope:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          docker run -d --name ts -p 8787:8787 --read-only --tmpfs /tmp --cap-drop ALL -e WARMUP_MINUTES=5 trenchscope:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/healthz >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8787/healthz
          curl -fsS http://127.0.0.1:8787/readyz
          curl -fsS http://127.0.0.1:8787/metrics | grep -q '^trenchscope_info{mode="demo"'
          curl -fsS http://127.0.0.1:8787/ | grep -q '<div id="root">'
          docker stop -t 60 ts
          docker logs ts 2>&1 | grep -q 'SIGTERM received'
      - name: Container logs
        if: failure()
        run: docker logs ts || true
